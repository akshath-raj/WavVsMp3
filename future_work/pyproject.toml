[project]
name = "audio-format-pilot"
version = "0.1.0"
description = "Audio LLM Format Robustness — Pilot (CREMA-D emotion recognition across containers/codecs)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "praat-parselmouth>=0.4",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "jiwer>=3.0",
    # Model SDK (Azure AI Foundry). openai supports the Azure OpenAI audio-chat
    # models; azure-ai-inference covers the Foundry serverless catalog (e.g. Phi-4).
    "openai>=1.40",
    "azure-ai-inference>=1.0.0b4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
