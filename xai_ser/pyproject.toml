[project]
name = "xai-ser"
version = "0.1.0"
description = "Explainable speech emotion recognition across audio container/codec conditions (CREMA-D)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # data
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.12",
    "statsmodels>=0.14",
    # audio
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.3",
    "audioread>=3.0",
    # modelling
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "torch>=2.4",
    # explainability
    "shap>=0.46",
    "lime>=0.2.0.1",
    "captum>=0.7",
    # plotting / utils
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xai_ser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
